networks:
  direct_net:
    external: true
  internal:
    external: false

services:
  dev_web:
    build: .
    env_file:
      - ${ENV_FILE:-.env}
    command: bash -c 'while !</dev/tcp/dev_postgres/5432; do sleep 1; done; gunicorn --bind 0.0.0.0:8000 config.wsgi'
    restart: always
    ports:
      - '8020:8000'
    expose:
      - 8020
    depends_on:
      - dev_postgres
    labels:
      - "traefik.enable=true"
      #- "traefik.http.routers.django.rule=Host(`$DOMAIN_NAME`)"
      #- "traefik.http.routers.django.tls=true"
      ## HTTP Routers
      - "traefik.http.routers.django-dev-rtr.entrypoints=https"
      - "traefik.http.routers.django-dev-rtr.rule=Host(`$DOMAIN_NAME`)"
      ## Middlewares
      - "traefik.http.routers.django-dev-rtr.middlewares=chain-web-no-auth@file"
      ## HTTP Services
      - "traefik.http.routers.django-dev-rtr.service=django-dev-svc"
      - "traefik.http.services.django-dev-svc.loadbalancer.server.port=8000"
      ## Disable from watchtower
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - direct_net
      - internal

  dev_postgres:
    image: postgres:13
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - ${DOCKERDIR_DB}:/var/lib/postgresql/data
    restart: always
    ports:
      - "15432:5432"
    environment:
      - "POSTGRES_DB=${DATABASES_NAME}"
      - "POSTGRES_USER=${DATABASES_USER}"
      - "POSTGRES_PASSWORD=${DATABASES_PASSWORD}"
    networks:
      - internal
      - direct_net

  dev_nginx:
    image: nginx:1.15-alpine
    env_file:
      - ${ENV_FILE:-.env}
    restart: always
    volumes:
      - ${DOCKERDIR_APP}/nginx.conf:/etc/nginx/conf.d/default.conf
      - ${DOCKERDIR_APP}/config/static:/static
      - ${DOCKERDIR_APP}/config/media:/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.static-dev-http.entrypoints=https"
      - "traefik.http.routers.static-dev-http.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/static`,`/media`)"
    networks:
      - direct_net
      - internal
    depends_on:
      - dev_web
