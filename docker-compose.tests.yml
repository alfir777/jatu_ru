networks:
  direct_net:
    external: true

services:
  flake8:
    build:
      context: ./
      dockerfile: tests.Dockerfile
    command: bash -c 'poetry run flake8 .'
    volumes:
      - .:/home/user/web
    restart: always
    networks:
      - direct_net

  tests:
    build:
      context: ./
      dockerfile: tests.Dockerfile
    command: bash -c 'python3 manage.py test'
    volumes:
      - .:/home/user/web
    restart: always
    networks:
      - direct_net
